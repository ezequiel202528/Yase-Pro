<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YaSe PRO - Acesso Vendedor</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b0f19; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .login-input { background-color: #111827; border: 1px solid rgba(255, 255, 255, 0.1); color: white; outline: none; transition: all 0.2s; }
    .login-input:focus { border-color: #f59e0b; box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.2); }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

  <!-- Container Principal Otimizado para Celular -->
  <div class="w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-white/10 rounded-3xl p-6 sm:p-8 shadow-2xl">
    
    <!-- Cabeçalho / Logo -->
    <div class="text-center mb-8">
      <div class="w-14 h-14 bg-amber-500/10 border border-amber-500/20 rounded-2xl flex items-center justify-center mx-auto mb-4 text-amber-400 text-2xl font-black">
        <i class="fa-solid fa-fire-extinguisher"></i>
      </div>
      <h1 class="text-xl font-bold tracking-wide text-white">YaSe <span class="text-amber-500">PRO</span></h1>
      <p class="text-xs text-slate-400 mt-1">Portal do Vendedor Externo</p>
    </div>

    <!-- Formulário de Login -->
    <form id="formLoginVendedor" class="space-y-5">
      
      <!-- Passo 1: CNPJ da Empresa -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">CNPJ da Empresa</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-500">
            <i class="fa-solid fa-building"></i>
          </span>
          <input type="text" id="cnpjEmpresa" placeholder="00000000000100" required
                 class="login-input w-full h-12 pl-11 pr-4 rounded-xl text-sm">
        </div>
      </div>

      <!-- Passo 2: Selecionar Vendedor -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Selecionar Vendedor</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-500">
            <i class="fa-solid fa-user-tie"></i>
          </span>
          <select id="selectVendedor" disabled required
                  class="login-input w-full h-12 pl-11 pr-4 rounded-xl text-sm appearance-none disabled:opacity-50 disabled:cursor-not-allowed">
            <option value="">Primeiro digite o CNPJ...</option>
          </select>
          <span class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-slate-500">
            <i class="fa-solid fa-chevron-down text-xs"></i>
          </span>
        </div>
      </div>

      <!-- Passo 3: Senha -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Palavra-passe / Senha</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-500">
            <i class="fa-solid fa-lock"></i>
          </span>
          <input type="password" id="senhaVendedor" placeholder="••••••••" required
                 class="login-input w-full h-12 pl-11 pr-12 rounded-xl text-sm">
          <button type="button" onclick="toggleSenha()" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-white">
            <i id="iconeOlho" class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <!-- Botão de Entrar -->
      <button type="submit" id="btnEntrar"
              class="w-full h-12 bg-amber-500 hover:bg-amber-400 text-slate-950 rounded-xl font-black text-xs uppercase tracking-wider transition-all shadow-lg shadow-amber-500/20 active:scale-[0.98]">
        Entrar no Sistema
      </button>
    </form>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const URL_SB = "https://gzojpxgpgjapsegerscb.supabase.co";
    const KEY_SB = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd6b2pweGdwZ2phcHNlZ2Vyc2NiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk4Nzc2MzUsImV4cCI6MjA4NTQ1MzYzNX0.vSaIuKyEuzNEGxFsawugLwtUpwWqYpCMP_a3JfWrY5s";
    const sb = supabase.createClient(URL_SB, KEY_SB);

    let empresaCacheId = null;
    let vendedoresLista = [];

    async function carregarVendedoresPorCnpj(cnpjBruto) {
      const cnpjLimpo = cnpjBruto.replace(/\D/g, '');
      if (!cnpjLimpo) return;

      try {
        const { data: empresaData, error: empresaErr } = await sb
          .from("empresas")
          .select("id")
          .eq("cnpj", cnpjLimpo)
          .single();

        if (empresaErr || !empresaData) {
          throw new Error("Empresa não encontrada com este CNPJ.");
        }

        empresaCacheId = empresaData.id;

        const { data: usuariosData, error: usuariosErr } = await sb
          .from("usu_arios")
          .select("*")
          .eq("empresa_id", empresaCacheId)
          .or('nivel_permissao.ilike.%vendedor%');

        if (usuariosErr) throw usuariosErr;

        vendedoresLista = usuariosData || [];
        const select = document.getElementById("selectVendedor");
        select.innerHTML = '<option value="">Selecione o seu nome...</option>';

        if (vendedoresLista.length === 0) {
          select.disabled = true;
          mostrarToast("⚠️ Nenhum vendedor registado para este CNPJ.", "erro");
          return;
        }

        vendedoresLista.forEach(v => {
          select.innerHTML += `<option value="${v.id}">${v.nome_completo} (${v.nivel_permissao})</option>`;
        });

        select.disabled = false;
        mostrarToast("✅ Empresa identificada com sucesso!");

      } catch (err) {
        console.error(err);
        document.getElementById("selectVendedor").innerHTML = '<option value="">CNPJ inválido ou sem vendedores...</option>';
        document.getElementById("selectVendedor").disabled = true;
        mostrarToast("❌ " + (err.message || "Erro ao localizar empresa."), "erro");
      }
    }

    document.getElementById("cnpjEmpresa").addEventListener("blur", async (e) => {
      const cnpjDigitado = e.target.value.trim();
      if (cnpjDigitado) {
        mostrarToast("A procurar empresa...", "sucesso");
        await carregarVendedoresPorCnpj(cnpjDigitado);
      }
    });

    window.addEventListener("DOMContentLoaded", async () => {
      const params = new URLSearchParams(window.location.search);
      const cnpjParam = params.get("cnpj");
      if (cnpjParam) {
        document.getElementById("cnpjEmpresa").value = cnpjParam;
        await carregarVendedoresPorCnpj(cnpjParam);
      }
    });

    document.getElementById("formLoginVendedor").addEventListener("submit", async (e) => {
      e.preventDefault();
      const vendedorId = document.getElementById("selectVendedor").value;
      const senhaDigitada = document.getElementById("senhaVendedor").value;

      if (!vendedorId) {
        mostrarToast("❌ Selecione um vendedor.", "erro");
        return;
      }

      const vendedorSelecionado = vendedoresLista.find(v => v.id == vendedorId);

      if (!vendedorSelecionado) {
        mostrarToast("❌ Vendedor não encontrado.", "erro");
        return;
      }

      if (vendedorSelecionado.senha !== senhaDigitada) {
        mostrarToast("❌ Palavra-passe incorreta.", "erro");
        return;
      }

      // Salva os dados no navegador
      localStorage.setItem("yase_vendedor_logado", JSON.stringify(vendedorSelecionado));
      localStorage.setItem("yase_empresa_id", empresaCacheId);

      mostrarToast("✅ Login efetuado! A redirecionar...");

      // Redireciona para o Painel do Vendedor
      setTimeout(() => {
        window.location.href = "PainelVendedor.html"; 
      }, 1000);
    });

    function toggleSenha() {
      const input = document.getElementById("senhaVendedor");
      const icone = document.getElementById("iconeOlho");
      if (input.type === "password") {
        input.type = "text";
        icone.className = "fa-solid fa-eye-slash";
      } else {
        input.type = "password";
        icone.className = "fa-solid fa-eye";
      }
    }

    function mostrarToast(mensagem, tipo = "sucesso") {
      const container = document.getElementById("toastContainer");
      if (!container) return;

      const toast = document.createElement("div");
      const corFundo = tipo === "sucesso" 
        ? "bg-emerald-950/90 text-emerald-400 border-emerald-500/30" 
        : "bg-red-950/90 text-red-400 border-red-500/30";

      toast.className = `pointer-events-auto flex items-center gap-3 px-5 py-4 rounded-2xl border shadow-2xl backdrop-blur-md transition-all duration-300 translate-x-10 opacity-0 ${corFundo}`;
      toast.innerHTML = `<span class="text-xs font-black tracking-wide">${mensagem}</span>`;

      container.appendChild(toast);

      setTimeout(() => toast.classList.remove("translate-x-10", "opacity-0"), 10);
      setTimeout(() => {
        toast.classList.add("translate-x-10", "opacity-0");
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }
  </script>
</body>
</html>
