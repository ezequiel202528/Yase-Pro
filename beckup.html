<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YaSe PRO - Painel do Vendedor</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b0f19; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .yase-input { background-color: #111827; border: 1px solid rgba(255, 255, 255, 0.1); color: white; outline: none; transition: all 0.2s; }
    .yase-input:focus { border-color: #f59e0b; box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.2); }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Topbar / Cabeçalho do Vendedor -->
  <header class="bg-slate-900/80 backdrop-blur-xl border-b border-white/10 px-4 py-3.5 flex justify-between items-center sticky top-0 z-40">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-amber-500/10 border border-amber-500/20 rounded-xl flex items-center justify-center text-amber-400 text-lg font-black">
        <i class="fa-solid fa-fire-extinguisher"></i>
      </div>
      <div>
        <h1 class="text-xs font-bold uppercase tracking-wider text-white" id="nomeVendedorDisplay">A carregar...</h1>
        <p class="text-[10px] text-amber-400 font-semibold" id="cargoVendedorDisplay">Vendedor Externo</p>
      </div>
    </div>
    
    <!-- Botão Sair / Logout -->
    <button onclick="sairDoPainel()" class="px-3 py-2 bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 rounded-xl text-xs font-bold transition-all flex items-center gap-2">
      <i class="fa-solid fa-right-from-bracket"></i> Sair
    </button>
  </header>

  <!-- Conteúdo Principal -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6 space-y-6">
    
    <!-- Seção de Boas-vindas e Ações Rápidas -->
    <div class="bg-slate-900/60 border border-white/10 rounded-3xl p-5 sm:p-6 backdrop-blur-md shadow-xl">
      <h2 class="text-lg font-bold text-white mb-1">Novo Pedido / Carga</h2>
      <p class="text-xs text-slate-400 mb-5">Preencha os dados do cliente e os itens para registar a solicitação no sistema.</p>

      <!-- Formulário de Pedido -->
      <form id="formPedido" class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- Nome do Cliente -->
          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Nome do Cliente</label>
            <input type="text" id="clienteNome" placeholder="Ex: Auto Posto Central" required
                   class="yase-input w-full h-11 px-4 rounded-xl text-xs">
          </div>
          <!-- CNPJ / CPF do Cliente -->
          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">CNPJ / CPF do Cliente</label>
            <input type="text" id="clienteDocumento" placeholder="00.000.000/0001-00" required
                   class="yase-input w-full h-11 px-4 rounded-xl text-xs">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <!-- Tipo de Serviço -->
          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Serviço / Operação</label>
            <select id="tipoServico" class="yase-input w-full h-11 px-3 rounded-xl text-xs">
              <option value="Recarga de Extintores">Recarga de Extintores</option>
              <option value="Manutenção / Teste Hidrostático">Manutenção / Teste Hidrostático</option>
              <option value="Venda de Equipamentos Novos">Venda de Equipamentos Novos</option>
            </select>
          </div>
          <!-- Quantidade de Itens -->
          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Qtd. de Extintores / Itens</label>
            <input type="number" id="quantidadeItens" min="1" value="1" required
                   class="yase-input w-full h-11 px-4 rounded-xl text-xs">
          </div>
          <!-- Observações -->
          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Observações / Lote</label>
            <input type="text" id="observacaoPedido" placeholder="Ex: Urgente, buscar até sexta"
                   class="yase-input w-full h-11 px-4 rounded-xl text-xs">
          </div>
        </div>

        <button type="submit" id="btnSalvarPedido"
                class="w-full h-12 bg-amber-500 hover:bg-amber-400 text-slate-950 rounded-xl font-black text-xs uppercase tracking-wider transition-all shadow-lg shadow-amber-500/20 active:scale-[0.98] mt-2">
          Registar Pedido no Sistema
        </button>
      </form>
    </div>

    <!-- Lista de Pedidos Recentes Feitos pelo Vendedor -->
    <div class="bg-slate-900/60 border border-white/10 rounded-3xl p-5 sm:p-6 backdrop-blur-md shadow-xl">
      <h3 class="text-sm font-bold text-white mb-4 uppercase tracking-wider">Meus Pedidos Recentes</h3>
      
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-white/10 text-[10px] uppercase font-bold text-slate-400">
              <th class="py-3 px-3">Cliente</th>
              <th class="py-3 px-3">Serviço</th>
              <th class="py-3 px-3">Qtd</th>
              <th class="py-3 px-3">Status</th>
            </tr>
          </thead>
          <tbody id="tabelaMeusPedidos" class="text-xs">
            <tr>
              <td colspan="4" class="text-center py-6 text-slate-500 italic">A carregar pedidos...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Toast Container para Alertas -->
  <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const URL_SB = "https://gzojpxgpgjapsegerscb.supabase.co";
    const KEY_SB = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd6b2pweGdwZ2phcHNlZ2Vyc2NiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk4Nzc2MzUsImV4cCI6MjA4NTQ1MzYzNX0.vSaIuKyEuzNEGxFsawugLwtUpwWqYpCMP_a3JfWrY5s";
    const sb = supabase.createClient(URL_SB, KEY_SB);

    let vendedorLogado = null;
    let empresaId = null;

    // Inicialização da Sessão
    function initVendedor() {
      const vJson = localStorage.getItem("yase_vendedor_logado");
      const eId = localStorage.getItem("yase_empresa_id");

      if (!vJson || !eId) {
        // Se não houver sessão ativa, chuta de volta para a tela de login
        window.location.href = "loginVendedor.html";
        return;
      }

      vendedorLogado = JSON.parse(vJson);
      empresaId = eId;

      document.getElementById("nomeVendedorDisplay").innerText = vendedorLogado.nome_completo;
      document.getElementById("cargoVendedorDisplay").innerText = vendedorLogado.nivel_permissao || "Vendedor Externo";

      carregarMeusPedidos();
    }

    initVendedor();

    // Sair do Painel
    function sairDoPainel() {
      localStorage.removeItem("yase_vendedor_logado");
      localStorage.removeItem("yase_empresa_id");
      window.location.href = "loginVendedor.html";
    }

    // Carregar pedidos do vendedor logado
    async function carregarMeusPedidos() {
      const tbody = document.getElementById("tabelaMeusPedidos");
      try {
        // Nota: Certifique-se de ter uma tabela 'pedidos_vendedores' ou ajuste para a tabela correspondente do seu banco
        const { data, error } = await sb
          .from("pedidos_vendedores")
          .select("*")
          .eq("vendedor_id", vendedorLogado.id)
          .order("created_at", { ascending: false });

        if (error) {
          // Se a tabela ainda não existir no banco, exibe aviso amigável
          tbody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-slate-500 italic">Tabela de pedidos ainda não criada no Supabase. O formulário está pronto para gravação!</td></tr>`;
          return;
        }

        if (!data || data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-slate-500">Nenhum pedido registado ainda.</td></tr>`;
          return;
        }

        tbody.innerHTML = "";
        data.forEach(p => {
          tbody.innerHTML += `
            <tr class="border-b border-white/5 hover:bg-white/5">
              <td class="py-3 px-3 font-bold text-white">${p.cliente_nome}</td>
              <td class="py-3 px-3 text-slate-300">${p.tipo_servico}</td>
              <td class="py-3 px-3 text-amber-400 font-bold">${p.quantidade}</td>
              <td class="py-3 px-3"><span class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-amber-500/10 text-amber-400 border border-amber-500/20">Pendente</span></td>
            </tr>
          `;
        });
      } catch (err) {
        console.error(err);
        tbody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-slate-400 italic">Pronto para receber registos de pedidos.</td></tr>`;
      }
    }

    // Registo de novo pedido
    document.getElementById("formPedido").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const novoPedido = {
        empresa_id: empresaId,
        vendedor_id: vendedorLogado.id,
        cliente_nome: document.getElementById("clienteNome").value,
        cliente_documento: document.getElementById("clienteDocumento").value,
        tipo_servico: document.getElementById("tipoServico").value,
        quantidade: parseInt(document.getElementById("quantidadeItens").value),
        observacao: document.getElementById("observacaoPedido").value,
        status: "Pendente"
      };

      try {
        const { error } = await sb.from("pedidos_vendedores").insert([novoPedido]);
        if (error) throw error;

        mostrarToast("✅ Pedido registado com sucesso!");
        document.getElementById("formPedido").reset();
        document.getElementById("quantidadeItens").value = "1";
        carregarMeusPedidos();
      } catch (err) {
        console.error(err);
        mostrarToast("❌ Erro ao registar pedido. Verifique a tabela no Supabase.", "erro");
      }
    });

    // Toast de Alerta Moderno
    function mostrarToast(mensagem, tipo = "sucesso") {
      const container = document.getElementById("toastContainer");
      if (!container) return;

      const toast = document.createElement("div");
      const corFundo = tipo === "sucesso" 
        ? "bg-emerald-950/90 text-emerald-400 border-emerald-500/30" 
        : "bg-red-950/90 text-red-400 border-red-500/30";

      toast.className = `pointer-events-auto flex items-center gap-3 px-5 py-4 rounded-2xl border shadow-2xl backdrop-blur-md transition-all duration-300 translate-x-10 opacity-0 ${corFundo}`;
      toast.innerHTML = `<span class="text-xs font-black tracking-wide">${mensagem}</span>`;

      container.appendChild(toast);

      setTimeout(() => toast.classList.remove("translate-x-10", "opacity-0"), 10);
      setTimeout(() => {
        toast.classList.add("translate-x-10", "opacity-0");
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }
  </script>
</body>
</html>
